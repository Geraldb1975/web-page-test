<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Le Wagon - Web Development Sprint</title>

  <!-- Change these Google fonts with your own choice -->
  <link href="https://fonts.googleapis.com/css?family=Lalezar:400|Gudea:400,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Banner section -->

  <div class="banner">
    <h1>Le Wagon</h1>
    <p>Partenariat Insitoo</p>
    <a class="button-blue" href="https://google.com/">Visit URL</a>
  </div>

  <!-- Cards section -->

  <div class="container">
    <h2>Nos écoles dans le monde</h2>
  
    <div class="grid">
      <div class="card-white">
        <img src="images/london.jpg" alt="London" width="200"/>
        <h3>Londres</h3>
        <p>Apprendre à Londres</p>
      </div>
    
      <div class="card-white">
        <img src="images/paris.jpg" alt="Paris" width="200"/>
        <h3>Paris</h3>
        <p>Apprendre à Paris</p>
      </div>
    
      <div class="card-white">  
        <img src="images/shanghai.jpg" alt="Shanghai" width="200"/>
        <h3>Shanghai</h3>
        <p>Apprendre à Shanghai</p>
      </div>
    </div>
  </div>

  <!-- Footer section -->
  
  <div class="footer">  
    <p>Insitoo x Le Wagon</p>
  </div>

</body>
</html>
